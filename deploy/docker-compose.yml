  #     postgres:
  #       condition: service_healthy
  #   restart: unless-stopped
  #   # 容器日志轮转（防 stdout 日志打满磁盘；应用层 AIOPS_LOGFILE 文件轮转与此互不冲突）
  #   logging:
  #     driver: json-file
  #     options:
  #       max-size: "50m"
