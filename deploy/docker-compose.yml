# AIOps 中间件编排：PostgreSQL（唯一存储，app 本地 run 连接）。
# 规范约定：mysql/redis 等中间件一律用 docker 启动；应用本体开发期 `go run`。
# 生产部署可参照 app 服务注释启用容器化。
# 镜像 pgvector/pgvector:pg16 = PG16 + vector 扩展（RAG 知识检索层；与 postgres:16 同大版本，
# aiops_pgdata 卷数据格式兼容，直接换镜像即可，升级前建议先备份卷）。
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aiops-postgres
    environment:
      POSTGRES_USER: aiops
      POSTGRES_PASSWORD: aiops
      POSTGRES_DB: aiops
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - aiops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiops -d aiops"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # --- 生产/演示用 app 容器（开发期注释掉，用 go run 本地跑）---
  # app:
  #   build:
  #     context: ..
  #     dockerfile: deploy/app.Dockerfile
